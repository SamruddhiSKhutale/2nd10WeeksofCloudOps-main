```yaml
name: Docker Compose CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ec2-deployment
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to AWS EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          set -e

          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            "$EC2_USER@$EC2_HOST" 'bash -se' <<'REMOTE'
          set -e

          APP_DIR="$HOME/apps/2nd10WeeksofCloudOps-main"

          if [ ! -d "$APP_DIR/.git" ]; then
            mkdir -p "$HOME/apps"
            git clone https://github.com/SamruddhiSKhutale/2nd10WeeksofCloudOps-main.git "$APP_DIR"
          fi

          cd "$APP_DIR"

          git fetch origin main
          git reset --hard origin/main

          docker --version
          docker compose version

          docker compose config
          docker compose up -d --build --remove-orphans

          echo "Containers on EC2:"
          docker compose ps

          echo "Running Docker containers:"
          docker ps

          REMOTE

      - name: Deployment completed
        if: success()
        run: echo "Application deployed successfully to AWS EC2."

      - name: Deployment failed
        if: failure()
        run: echo "Deployment failed. Check the failed step in the Actions logs."
```
